name: sentinel-soc

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    environment: &backend-environment
      SERVICE_ROLE: core
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-demo-key-change-before-deployment}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-45}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DATA_DIR: /srv/data
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      ASYNC_MODE: ${ASYNC_MODE:-celery}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - evidence-data:/srv/data
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "sentinel.events"]
    environment:
      SERVICE_ROLE: all
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-demo-key-change-before-deployment}
      AI_PROVIDER: mock
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [app, data]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  ingestion:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: ingestion
      AI_PROVIDER: mock
      AI_API_KEY: ""
    depends_on:
      api: { condition: service_healthy }
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  assistant:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-environment
      SERVICE_ROLE: assistant
    depends_on:
      api: { condition: service_healthy }
    networks: [app, data]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
      ingestion: { condition: service_healthy }
      assistant: { condition: service_healthy }
    networks: [edge, app]

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [app]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    networks: [app]

volumes:
  postgres-data:
  redis-data:
  evidence-data:
  prometheus-data:

networks:
  edge:
  app:
  data:
    internal: true