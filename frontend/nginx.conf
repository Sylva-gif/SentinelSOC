server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; img-src 'self' data:" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    client_max_body_size 5m;

    location /api/events/ { proxy_pass http://ingestion:8000; }
    location /api/demo/ { proxy_pass http://ingestion:8000; }
    location = /api/procedures { proxy_pass http://assistant:8000; }
    location ~ ^/api/incidents/[0-9]+/assistant$ { proxy_pass http://assistant:8000; }
    location = /ingestion/openapi.json { proxy_pass http://ingestion:8000/openapi.json; }
    location = /assistant/openapi.json { proxy_pass http://assistant:8000/openapi.json; }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    location = /docs {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'" always;
        proxy_pass http://api:8000/docs;
    }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; }
    location = /health { proxy_pass http://api:8000/health; }
    location = /ready { proxy_pass http://api:8000/ready; }

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
}