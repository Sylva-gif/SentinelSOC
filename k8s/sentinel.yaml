apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-soc
---
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel-soc
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_BEFORE_DEPLOYMENT
  DATABASE_URL: postgresql+psycopg://sentinel:REPLACE_BEFORE_DEPLOYMENT@postgres:5432/sentinel
  JWT_SECRET: REPLACE_WITH_LONG_RANDOM_SECRET
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: sentinel-soc
data:
  REDIS_URL: redis://redis:6379/0
  JWT_EXPIRE_MINUTES: '45'
  AI_PROVIDER: mock
  ASYNC_MODE: celery
  RATE_LIMIT_PER_MINUTE: '120'
  DATA_DIR: /srv/data
  OTEL_ENABLED: 'false'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: sentinel-soc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidence-data
  namespace: sentinel-soc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sentinel-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17.4-alpine
        env:
        - name: POSTGRES_DB
          value: sentinel
        - name: POSTGRES_USER
          value: sentinel
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: database
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U sentinel -d sentinel
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      volumes:
      - name: database
        persistentVolumeClaim:
          claimName: postgres-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentinel-soc
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sentinel-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.2-alpine
        args:
        - redis-server
        - --appendonly
        - 'yes'
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: redis
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      volumes:
      - name: redis
        persistentVolumeClaim:
          claimName: redis-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sentinel-soc
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sentinel-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: api
        image: sentinel-soc-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: sentinel-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: JWT_SECRET
        - name: SERVICE_ROLE
          value: core
        volumeMounts:
        - name: evidence
          mountPath: /srv/data
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: evidence
        persistentVolumeClaim:
          claimName: evidence-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sentinel-soc
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sentinel-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: worker
        image: sentinel-soc-api:latest
        imagePullPolicy: IfNotPresent
        command:
        - celery
        - -A
        - app.worker:celery_app
        - worker
        - --loglevel=INFO
        - --concurrency=2
        - -Q
        - sentinel.events
        envFrom:
        - configMapRef:
            name: sentinel-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: JWT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sentinel-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: sentinel-soc-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 101
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sentinel-soc
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: sentinel-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: ingestion
        image: sentinel-soc-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: sentinel-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: JWT_SECRET
        - name: SERVICE_ROLE
          value: ingestion
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        command:
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  namespace: sentinel-soc
spec:
  selector:
    app: ingestion
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
  namespace: sentinel-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assistant
  template:
    metadata:
      labels:
        app: assistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: assistant
        image: sentinel-soc-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: sentinel-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: JWT_SECRET
        - name: SERVICE_ROLE
          value: assistant
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        command:
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
---
apiVersion: v1
kind: Service
metadata:
  name: assistant
  namespace: sentinel-soc
spec:
  selector:
    app: assistant
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: sentinel-soc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress
  namespace: sentinel-soc
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - postgres
      - redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - api
          - ingestion
          - assistant
          - worker
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
